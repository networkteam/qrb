on:
  push:
    tags:
      - v*
    branches:
      - v*
      - main
  pull_request:

name: run tests
jobs:
  golangci:
    strategy:
      matrix:
        module: [ '.', 'examples/libpq', 'examples/pgx' ]
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}

  test:
    strategy:
      matrix:
        module: [ '.', 'examples/libpq', 'examples/pgx' ]
    name: test (${{ matrix.module }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - name: Run tests
        run: go test -v ./...
        working-directory: ${{ matrix.module }}

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - name: Calc coverage
        run: |
          go test -cover ./... -coverpkg=github.com/networkteam/qrb/... -coverprofile=coverage.txt
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
